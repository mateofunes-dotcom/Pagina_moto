<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las 10 Mejores Motos del Mercado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1>Las 10 Mejores Motos del Mercado</h1>
    <p>Una selección de motos destacadas por rendimiento, tecnología y calidad en cada categoría.</p>
  </header>

  <nav class="filters" id="filters">
    <button class="filter-btn active" data-filter="todas">Todas</button>
    <button class="filter-btn" data-filter="Deportiva">Deportivas</button>
    <button class="filter-btn" data-filter="Aventura">Aventura</button>
    <button class="filter-btn" data-filter="Naked">Naked</button>
    <button class="filter-btn" data-filter="Clásica">Clásicas</button>
  </nav>

  <main class="grid" id="grid"></main>

  <footer>
    <p>Información orientativa. Consulta precios y especificaciones actualizadas con el concesionario oficial.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
